<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamHub control centre</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233147e8'/%3E%3Cpath d='M7 11h9m0 0 4-4m-4 4 4 4M25 21h-9m0 0 4-4m-4 4 4 4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #edefea;
  --panel: #fafbf8;
  --ink: #1b2320;
  --muted: #5d6963;
  --line: #d2d8d0;
  --wash: #e3e7e0;
  --signal: #3147e8;
  --signal-ink: #ffffff;
  --ok: #1d7f52;
  --warn: #a86f00;
  --bad: #b3382c;
  --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131917; --panel: #1a211e; --ink: #e6ebe7; --muted: #93a09a; --line: #2c3632; --wash: #222b27;
    --signal: #7f8fff; --signal-ink: #10142e; --ok: #55c790; --warn: #e2b04a; --bad: #f08376;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
a { color: var(--signal); }
code, .mono { font-family: var(--mono); font-size: .86em; }
h1, h2, h3, h4, p { margin: 0; }

.shell { max-width: 1120px; margin: 0 auto; padding: 20px 20px 80px; }
header.top { padding: 8px 0 22px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.brand span { color: var(--muted); }

/* the signal chain: the one distinctive element */
.chain { display: flex; align-items: stretch; margin-top: 18px; overflow-x: auto; padding-bottom: 4px; }
.node { flex: 0 0 auto; min-width: 150px; padding: 9px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; }
.node b { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.node span { font-weight: 600; white-space: nowrap; }
.node.hub { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.wire { flex: 1 0 28px; min-width: 28px; position: relative; align-self: center; height: 2px; background: var(--line); }
.wire::after { content: ""; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left: 7px solid var(--line); }
.chain.busy .wire { background: linear-gradient(90deg, var(--line) 0 30%, var(--signal) 50%, var(--line) 70% 100%); background-size: 200% 100%; animation: flow 1s linear infinite; }
@keyframes flow { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .chain.busy .wire { animation: none; background: var(--signal); } }

.layout { display: grid; grid-template-columns: 190px 1fr; gap: 36px; margin-top: 26px; }
nav.tabs { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; align-self: start; }
nav.tabs button { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav.tabs button:hover { background: var(--wash); color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; gap: 18px; }
  nav.tabs { flex-direction: row; overflow-x: auto; position: static; gap: 6px; }
  nav.tabs button { white-space: nowrap; border: 1px solid var(--line); }
}

main > section { display: none; }
main > section.on { display: block; }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 22px; }
h2 { font-size: 21px; letter-spacing: -.01em; }
.row { display: grid; grid-template-columns: minmax(180px, 250px) 1fr; gap: 10px 32px; padding: 18px 0; border-top: 1px solid var(--line); }
.row > .what h3 { font-size: 15px; font-weight: 600; }
.row > .what p { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
@media (max-width: 800px) { .row { grid-template-columns: 1fr; } }

input[type=text], input[type=password], input[type=number], select {
  width: 100%; max-width: 480px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
}
input.mono { font-family: var(--mono); font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.urlbox { display: flex; gap: 8px; align-items: stretch; max-width: 640px; }
.urlbox input { max-width: none; flex: 1; min-width: 0; }
.note { font-size: 13.5px; color: var(--muted); margin-top: 8px; max-width: 64ch; }
.note.warn { color: var(--warn); }
.note.bad { color: var(--bad); }
.note.ok { color: var(--ok); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.bad { color: var(--bad); border-color: currentColor; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.switch { position: relative; width: 40px; height: 24px; flex: none; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--signal); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--signal); outline-offset: 2px; }

.prov { border-top: 1px solid var(--line); padding: 16px 0; }
.prov-head { display: flex; align-items: center; gap: 14px; }
.logo { width: 38px; height: 38px; border-radius: 8px; background: var(--wash); object-fit: cover; flex: none; display: grid; place-items: center; font-weight: 700; color: var(--muted); overflow: hidden; }
.prov-head .meta { flex: 1; min-width: 0; }
.prov-head .meta b { font-weight: 600; }
.prov-head .meta div { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.prov-body { margin: 14px 0 0 52px; display: grid; gap: 16px; }
.prov-body h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 8px 0 4px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 0; max-width: 520px; }
.field label { display: block; }
.field small { display: block; color: var(--muted); font-size: 12.5px; white-space: pre-line; }
.field select { width: auto; min-width: 130px; }
.mirror { display: grid; grid-template-columns: minmax(0, 200px) 1fr; gap: 10px; align-items: center; max-width: 560px; }
@media (max-width: 800px) { .prov-body { margin-left: 0; } .mirror { grid-template-columns: 1fr; } }

.pairs { display: grid; gap: 8px; max-width: 640px; }
.pair { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
.pair input { max-width: none; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--wash); vertical-align: top; word-break: break-word; }
.scroll { overflow-x: auto; }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--muted); }
pre { background: var(--wash); padding: 10px 12px; border-radius: 6px; overflow: auto; max-height: 240px; font-family: var(--mono); font-size: 12px; margin: 8px 0 0; }
.stream { padding: 10px 0; border-bottom: 1px solid var(--wash); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.stream .t { font-weight: 600; }
.stream .u { grid-column: 1 / -1; color: var(--muted); word-break: break-all; }
.empty { color: var(--muted); padding: 18px 0; }

#toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; z-index: 9; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>StreamHub</h1><span>Control centre for your Stremio addon and Nuvio scrapers</span></div>
    <div class="chain" id="chain" aria-label="Request path"></div>
  </header>
  <div class="layout">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.setAttribute('style', v);
    else if (k.includes('-')) e.setAttribute(k, v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const toastEl = $('#toast');
let toastTimer;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Copied');
}
const b64u = (obj) => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)))); };
const keys = (o) => Object.keys(o || {});
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}

/* ---------- state ---------- */
const DEFAULTS = () => ({ tmdbKey: '', timeoutMs: 25000, sort: 'provider', maxPerProvider: 0, providers: {}, dns: { mode: 'system', doh: 'cloudflare', dohUrl: '', ipv4Only: true, hosts: {}, rewrites: {} } });
function merge(extra) {
  const d = DEFAULTS(); const x = extra || {}; const xd = x.dns || {};
  return { ...d, ...x, providers: JSON.parse(JSON.stringify(x.providers || {})), dns: { ...d.dns, ...xd, hosts: { ...(xd.hosts || {}) }, rewrites: { ...(xd.rewrites || {}) } } };
}
function compact(c) {
  const D = DEFAULTS(); const o = {};
  if (c.tmdbKey) o.tmdbKey = c.tmdbKey;
  if (c.timeoutMs !== D.timeoutMs) o.timeoutMs = c.timeoutMs;
  if (c.sort !== D.sort) o.sort = c.sort;
  if (c.maxPerProvider) o.maxPerProvider = c.maxPerProvider;
  const pr = {};
  for (const [id, p] of Object.entries(c.providers)) {
    const e = {};
    if (typeof p.enabled === 'boolean') e.enabled = p.enabled;
    if (p.settings && keys(p.settings).length) e.settings = p.settings;
    if (keys(e).length) pr[id] = e;
  }
  if (keys(pr).length) o.providers = pr;
  const d = {}; const n = c.dns;
  if (n.mode !== 'system') d.mode = n.mode;
  if (n.doh !== 'cloudflare') d.doh = n.doh;
  if (n.dohUrl) d.dohUrl = n.dohUrl;
  if (n.ipv4Only === false) d.ipv4Only = false;
  if (keys(n.hosts).length) d.hosts = n.hosts;
  if (keys(n.rewrites).length) d.rewrites = n.rewrites;
  if (keys(d).length) o.dns = d;
  return o;
}

const LS = 'streamhub.config', LP = 'streamhub.profile';
const readLS = (k, dflt) => { try { return JSON.parse(localStorage.getItem(k)) ?? dflt; } catch { return dflt; } };
let cfg = merge(readLS(LS, {}));
let profile = readLS(LP, null); // { id, secret }
let status = { profiles: false, serverTmdbKey: false };
let providers = [];
let saveState = { text: '', kind: '' };
let saveTimer;

function paintSave() { const s = $('#saveline'); if (s) { s.textContent = saveState.text; s.className = 'note ' + saveState.kind; } }
function onChange() {
  localStorage.setItem(LS, JSON.stringify(compact(cfg)));
  renderChain();
  if (profile) { saveState = { text: 'Saving…', kind: '' }; clearTimeout(saveTimer); saveTimer = setTimeout(syncProfile, 700); paintSave(); }
  if ($('#urls')) renderUrls();
}
async function syncProfile() {
  try {
    await api(`/api/profile/${profile.id}`, { method: 'PUT', headers: { 'X-Profile-Secret': profile.secret }, body: { config: compact(cfg) } });
    saveState = { text: 'Saved to your profile', kind: 'ok' };
  } catch (e) { saveState = { text: e.message, kind: 'bad' }; }
  paintSave();
}

const isOn = (p) => (typeof (cfg.providers[p.id] || {}).enabled === 'boolean' ? cfg.providers[p.id].enabled : p.enabled !== false);
function setEnabled(p, v) {
  const e = (cfg.providers[p.id] = cfg.providers[p.id] || {});
  if (v === (p.enabled !== false)) delete e.enabled; else e.enabled = v;
}
const origin = location.origin;
const scopePath = () => (profile ? `/u/${profile.id}` : `/c/${b64u(compact(cfg))}`);

/* ---------- header chain ---------- */
function renderChain() {
  const on = providers.filter(isOn).length;
  const d = cfg.dns;
  const names = { cloudflare: 'Cloudflare', google: 'Google', quad9: 'Quad9', custom: 'custom' };
  const resolver = d.mode === 'doh' ? `DoH · ${names[d.doh]}` : 'System DNS';
  const extra = keys(d.hosts).length + keys(d.rewrites).length;
  const node = (label, value, cls) => h('div', { class: 'node ' + (cls || '') }, h('b', { text: label }), h('span', { text: value }));
  const wire = () => h('div', { class: 'wire', 'aria-hidden': 'true' });
  $('#chain').replaceChildren(
    node('Sources', providers.length ? `${on} of ${providers.length} on` : '…'), wire(),
    node('Resolver', resolver + (extra ? ` + ${extra} override${extra > 1 ? 's' : ''}` : '')), wire(),
    node('StreamHub', 'Vercel function', 'hub'), wire(),
    node('Players', 'Stremio, Nuvio'),
  );
}
const setBusy = (b) => $('#chain').classList.toggle('busy', b);

/* ---------- tabs ---------- */
const TABS = [['install', 'Install'], ['providers', 'Providers'], ['dns', 'DNS'], ['test', 'Test'], ['settings', 'Settings']];
let current = 'install';
function showTab(id) {
  current = id;
  for (const [tid] of TABS) {
    const sec = $('#sec-' + tid); if (sec) sec.classList.toggle('on', tid === id);
    const b = $('#tab-' + tid); if (b) b.setAttribute('aria-selected', String(tid === id));
  }
  if (id === 'install') renderUrls();
  history.replaceState(null, '', location.pathname + '#' + id);
}
function row(title, desc, ...controls) { return h('div', { class: 'row' }, h('div', { class: 'what' }, h('h3', { text: title }), desc && h('p', { text: desc })), h('div', { class: 'ctl' }, ...controls)); }
function toggle(checked, onchange, label) { return h('label', { class: 'switch', 'aria-label': label }, h('input', { type: 'checkbox', checked, onchange: (e) => onchange(e.target.checked) }), h('i')); }

/* ---------- Install ---------- */
function urlBox(label, url) {
  return h('div', { class: 'urlbox' }, h('input', { type: 'text', class: 'mono', readOnly: true, value: url, 'aria-label': label, onfocus: (e) => e.target.select() }), h('button', { class: 'btn', onclick: () => copy(url) }, 'Copy'));
}
function renderUrls() {
  const box = $('#urls'); if (!box) return;
  const scope = scopePath();
  const stremio = origin + scope + '/manifest.json';
  const nuvio = origin + scope + '/nuvio/manifest.json';
  const host = stremio.replace(/^https?:\/\//, '');
  const warnings = [];
  if (!cfg.tmdbKey && !status.serverTmdbKey) warnings.push(h('p', { class: 'note bad', text: 'No TMDB key yet. Streams stay empty until you add one in Settings, or set TMDB_API_KEY in Vercel.' }));
  if (cfg.tmdbKey && !profile) warnings.push(h('p', { class: 'note warn', text: 'Your TMDB key is inside this link, so anyone you share it with can read it. Set TMDB_API_KEY in Vercel or save a profile instead.' }));
  if (!profile && stremio.length > 3000) warnings.push(h('p', { class: 'note warn', text: 'This link is getting long. A saved profile keeps it short.' }));
  box.replaceChildren(
    ...warnings,
    row('Stremio', 'Adds the addon to Stremio. Stream lists appear on any movie or episode page.',
      urlBox('Stremio addon URL', stremio),
      h('div', { class: 'actions' },
        h('a', { class: 'btn primary', href: 'stremio://' + host, text: 'Install in Stremio' }),
        h('a', { class: 'btn', href: 'https://web.stremio.com/#/addons?addon=' + encodeURIComponent(stremio), target: '_blank', rel: 'noopener', text: 'Open in Stremio Web' }))),
    row('Nuvio scrapers', 'A scraper repository. Its files run on your device, so Nuvio uses your device DNS. Mirror domains from the DNS tab are applied to the files served here.',
      urlBox('Nuvio repository URL', nuvio),
      h('p', { class: 'note', text: 'In Nuvio open Settings, then Local Scrapers (Providers), choose Add repository and paste this URL. Nuvio can also take the Stremio URL above as an addon.' })),
  );
}
function profileControls() {
  const wrap = h('div');
  const draw = () => {
    wrap.replaceChildren();
    if (!status.profiles) { wrap.append(h('span', { class: 'pill', text: 'Saved profiles not connected' })); return; }
    if (profile) {
      wrap.append(
        h('p', {}, h('span', { class: 'pill ok', text: 'Using saved profile' }), ' ', h('code', { text: profile.id })),
        h('p', { id: 'saveline', class: 'note ' + saveState.kind, text: saveState.text || 'Changes save automatically.' }),
        h('div', { class: 'actions' },
          h('button', { class: 'btn', onclick: () => copy(`${profile.id}:${profile.secret}`) }, 'Copy edit key'),
          h('button', { class: 'btn quiet', onclick: () => { profile = null; localStorage.removeItem(LP); draw(); renderUrls(); toast('Switched to a link with settings inside'); } }, 'Stop using profile')),
        h('p', { class: 'note', text: 'Keep the edit key. It is the only way to change this profile from another browser.' }));
    } else {
      wrap.append(h('div', { class: 'actions', style: 'margin-top:0' },
        h('button', { class: 'btn primary', onclick: async (e) => {
          e.target.disabled = true;
          try { profile = await api('/api/profile', { method: 'POST', body: { config: compact(cfg) } }); localStorage.setItem(LP, JSON.stringify(profile)); toast('Profile saved'); draw(); renderUrls(); }
          catch (err) { toast(err.message); e.target.disabled = false; }
        } }, 'Save as profile'),
        h('button', { class: 'btn', onclick: async () => {
          const v = prompt('Paste an edit key (id:secret)'); if (!v) return;
          const [id, secret] = v.trim().split(':');
          try { const r = await api(`/api/profile/${id}`, { headers: { 'X-Profile-Secret': secret } }); cfg = merge(r.config); profile = { id, secret }; localStorage.setItem(LP, JSON.stringify(profile)); onChange(); rebuildAll(); toast('Profile loaded'); }
          catch (err) { toast(err.message); }
        } }, 'Load existing profile')));
    }
  };
  draw();
  return wrap;
}
function buildInstall() {
  return h('section', { id: 'sec-install' },
    h('h2', { text: 'Install' }),
    h('p', { class: 'lead', text: 'Copy a link into your player. Every link carries your current settings.' }),
    h('div', { id: 'urls' }),
    row('Where settings live', status.profiles
      ? 'A saved profile keeps the link short and updates instantly. Change a setting and every player picks it up without reinstalling.'
      : 'Settings travel inside the link, so changing them later means installing the new link. Connect an Upstash Redis store in Vercel to enable saved profiles.',
    profileControls()));
}

/* ---------- Providers ---------- */
function settingControl(p, item) {
  const bag = () => { const e = (cfg.providers[p.id] = cfg.providers[p.id] || {}); return (e.settings = e.settings || {}); };
  const cur = () => { const s = (cfg.providers[p.id] || {}).settings || {}; return s[item.key] !== undefined ? s[item.key] : item.defaultValue; };
  const set = (v) => { const s = bag(); if (v === item.defaultValue) delete s[item.key]; else s[item.key] = v; onChange(); };
  const label = (small) => h('div', {}, h('label', { text: item.label }), small && h('small', { text: small }));
  switch (item.type) {
    case 'header': return h('h4', { text: item.label });
    case 'info': return h('p', { class: 'note', style: 'white-space:pre-line', text: item.label });
    case 'toggle': return h('div', { class: 'field' }, label(item.description), toggle(!!cur(), set, item.label));
    case 'select': return h('div', { class: 'field' }, label(item.description),
      h('select', { 'aria-label': item.label, onchange: (e) => set(e.target.value) }, (item.options || []).map((o) => h('option', { value: o.value, selected: String(cur()) === String(o.value), text: o.label }))));
    default: return h('div', { class: 'field' }, label(item.description),
      h('input', { type: item.type === 'number' ? 'number' : 'text', value: cur() ?? '', 'aria-label': item.label, oninput: (e) => set(item.type === 'number' ? Number(e.target.value) : e.target.value) }));
  }
}
function providerRow(p) {
  const body = h('div', { class: 'prov-body' });
  const fill = () => {
    body.replaceChildren();
    if (p.domains && p.domains.length) {
      body.append(h('div', {}, h('h4', { text: 'Mirror domain' }),
        ...p.domains.map((d) => h('div', { class: 'mirror' }, h('code', { text: d }),
          h('input', { type: 'text', class: 'mono', placeholder: 'Use a different domain for this site', value: cfg.dns.rewrites[d] || '', 'aria-label': `Mirror for ${d}`,
            oninput: (e) => { const v = e.target.value.trim().toLowerCase().replace(/^https?:\/\//, '').split('/')[0]; if (v) cfg.dns.rewrites[d] = v; else delete cfg.dns.rewrites[d]; onChange(); } })))));
    }
    if (p.settings && p.settings.length) body.append(h('div', {}, ...p.settings.map((it) => settingControl(p, it))));
    body.style.display = body.childNodes.length && isOn(p) ? '' : 'none';
  };
  const chips = [...(p.supportedTypes || []).map((t) => (t === 'tv' ? 'series' : t)), ...(p.formats || []), ...(p.contentLanguage || [])];
  const fallback = () => h('div', { class: 'logo', text: p.name[0] });
  const logo = p.logo ? h('img', { class: 'logo', src: p.logo, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer', onerror: (e) => e.target.replaceWith(fallback()) }) : fallback();
  const el = h('div', { class: 'prov' },
    h('div', { class: 'prov-head' }, logo,
      h('div', { class: 'meta' }, h('b', { text: p.name.replace(/\.$/, '') }), h('span', { class: 'mono', text: '  v' + p.version }), h('div', { text: p.description }), h('div', { class: 'chips' }, chips.map((c) => h('span', { class: 'pill', text: c })))),
      toggle(isOn(p), (v) => { setEnabled(p, v); onChange(); fill(); }, `Enable ${p.name}`)),
    body);
  fill();
  return el;
}
function buildProviders() {
  const all = (v) => () => { providers.forEach((p) => setEnabled(p, v)); onChange(); rebuildTab('providers'); };
  return h('section', { id: 'sec-providers' },
    h('h2', { text: 'Providers' }),
    h('p', { class: 'lead', text: 'Turn sources on or off and tune each one. Drop a new .js file into the providers folder and it appears here after the next deploy.' }),
    h('div', { class: 'actions', style: 'margin:0 0 14px' },
      h('button', { class: 'btn', onclick: all(true) }, 'Enable all'),
      h('button', { class: 'btn', onclick: all(false) }, 'Disable all')),
    h('div', {}, providers.length ? providers.map(providerRow) : h('p', { class: 'empty', text: 'No providers found.' })));
}

/* ---------- DNS ---------- */
function pairsEditor(obj, ph, kind) {
  const wrap = h('div', { class: 'pairs' });
  const clean = (v) => v.trim().toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
  const draw = () => {
    wrap.replaceChildren();
    for (const [k, v] of Object.entries(obj)) {
      wrap.append(h('div', { class: 'pair' },
        h('input', { type: 'text', class: 'mono', value: k, readOnly: true, 'aria-label': ph[0] }),
        h('input', { type: 'text', class: 'mono', value: v, readOnly: true, 'aria-label': ph[1] }),
        h('button', { class: 'btn quiet', 'aria-label': `Remove ${k}`, onclick: () => { delete obj[k]; onChange(); draw(); } }, 'Remove')));
    }
    const a = h('input', { type: 'text', class: 'mono', placeholder: ph[0], 'aria-label': 'New ' + ph[0] });
    const b = h('input', { type: 'text', class: 'mono', placeholder: ph[1], 'aria-label': 'New ' + ph[1] });
    const add = () => {
      const k = clean(a.value); const v = kind === 'ip' ? b.value.trim() : clean(b.value);
      if (!k || !v) return toast('Fill in both fields');
      if (kind === 'ip' && !/^[0-9a-f:.]+$/i.test(v)) return toast('Enter an IP address');
      obj[k] = v; onChange(); draw();
    };
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    wrap.append(h('div', { class: 'pair' }, a, b, h('button', { class: 'btn', onclick: add }, 'Add')));
  };
  draw();
  return wrap;
}
function buildDns() {
  const d = cfg.dns;
  const dohRow = h('div');
  const drawDoh = () => {
    dohRow.replaceChildren();
    if (d.mode !== 'doh') { dohRow.append(h('p', { class: 'note', style: 'margin-top:0', text: 'Using the DNS that Vercel provides. Switch to DNS over HTTPS if your sources are blocked or resolve to the wrong place.' })); return; }
    dohRow.append(
      h('select', { 'aria-label': 'DoH provider', onchange: (e) => { d.doh = e.target.value; onChange(); drawDoh(); } },
        [['cloudflare', 'Cloudflare (1.1.1.1)'], ['google', 'Google (8.8.8.8)'], ['quad9', 'Quad9'], ['custom', 'Custom URL']].map(([v, l]) => h('option', { value: v, selected: d.doh === v, text: l }))),
      d.doh === 'custom' && h('div', { style: 'margin-top:8px' },
        h('input', { type: 'text', class: 'mono', placeholder: 'https://dns.example/dns-query', value: d.dohUrl, 'aria-label': 'Custom DoH URL', oninput: (e) => { d.dohUrl = e.target.value.trim(); onChange(); } }),
        h('p', { class: 'note', text: 'It must support the JSON API (application/dns-json), as Cloudflare and Google do.' })));
  };
  const modeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Resolver' });
  const drawSeg = () => modeSeg.replaceChildren(...[['system', 'System'], ['doh', 'DNS over HTTPS']].map(([v, l]) => h('button', { 'aria-pressed': String(d.mode === v), onclick: () => { d.mode = v; onChange(); drawSeg(); drawDoh(); } }, l)));
  drawSeg(); drawDoh();

  const results = h('div');
  const testBtn = h('button', { class: 'btn', onclick: async () => {
    testBtn.disabled = true; results.replaceChildren(h('p', { class: 'note', text: 'Resolving…' }));
    const hosts = [...new Set(['api.themoviedb.org', ...providers.flatMap((p) => p.domains || []), ...keys(cfg.dns.hosts).filter((k) => !k.startsWith('*'))])].slice(0, 12);
    try {
      const r = await api('/api/dns', { method: 'POST', body: { config: compact(cfg), hosts } });
      results.replaceChildren(h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Host', 'Resolved by', 'Address', 'Time'].map((x) => h('th', { text: x })))),
        h('tbody', {}, r.results.map((x) => h('tr', {},
          h('td', { class: 'mono' }, x.host, x.target && h('div', { class: 'note', style: 'margin:0', text: `mirror: ${x.target}` })),
          h('td', { text: x.error ? '' : x.source }),
          h('td', { class: 'mono' }, x.error ? h('span', { class: 'pill bad', text: x.error }) : x.ips.join(', ')),
          h('td', { text: x.ms != null ? x.ms + ' ms' : '' })))))));
    } catch (e) { results.replaceChildren(h('p', { class: 'note bad', text: e.message })); }
    testBtn.disabled = false;
  } }, 'Test resolution');

  return h('section', { id: 'sec-dns' },
    h('h2', { text: 'DNS' }),
    h('p', { class: 'lead', text: 'Control how StreamHub finds the sites it reads from. This applies to every request made by the Stremio addon.' }),
    row('Resolver', 'System DNS is fastest. DNS over HTTPS bypasses DNS-level blocking and lets you choose the resolver.', modeSeg, h('div', { style: 'margin-top:10px' }, dohRow)),
    row('IPv4 only', 'Vercel functions usually have no IPv6 route. Leave this on unless a source needs it.', toggle(d.ipv4Only !== false, (v) => { d.ipv4Only = v; onChange(); }, 'IPv4 only')),
    row('Mirror domains', 'When a site moves, send its requests to the new domain without touching any code. Also applied to the Nuvio scraper files served here.', pairsEditor(d.rewrites, ['Original domain', 'Mirror domain'], 'host')),
    row('Host overrides', 'Pin a hostname to an IP address, like a line in a hosts file. Use *.example.com to cover subdomains. Private addresses are refused.', pairsEditor(d.hosts, ['Hostname', 'IP address'], 'ip')),
    row('Check it', 'Resolves TMDB and every provider domain with the settings above.', testBtn, results),
    row('What about Nuvio?', 'Nuvio scrapers run on your device, so they use your device DNS. On Android set Private DNS (Settings, Network, Private DNS) to a hostname such as one.one.one.one. Mirror domains above still reach Nuvio through the rewritten scraper files.'));
}

/* ---------- Test ---------- */
function buildTest() {
  let type = 'movie';
  const idInput = h('input', { type: 'text', class: 'mono', value: 'tt1375666', 'aria-label': 'IMDb or TMDB id', placeholder: 'tt1375666, tt0903747:1:1 or tmdb:27205' });
  const out = h('div');
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Type' });
  const drawSeg = () => seg.replaceChildren(...[['movie', 'Movie'], ['series', 'Episode']].map(([v, l]) => h('button', {
    'aria-pressed': String(type === v),
    onclick: () => { type = v; if (v === 'series' && !idInput.value.includes(':')) idInput.value = 'tt0903747:1:1'; if (v === 'movie' && !idInput.value.startsWith('tmdb')) idInput.value = idInput.value.split(':')[0]; drawSeg(); },
  }, l)));
  drawSeg();
  const run = h('button', { class: 'btn primary', onclick: async () => {
    run.disabled = true; setBusy(true); out.replaceChildren(h('p', { class: 'note', text: 'Asking every enabled provider. This can take up to your time limit.' }));
    try { out.replaceChildren(renderResult(await api('/api/test', { method: 'POST', body: { config: compact(cfg), type, id: idInput.value.trim() } }))); }
    catch (e) { out.replaceChildren(h('p', { class: 'note bad', text: e.message })); }
    run.disabled = false; setBusy(false);
  } }, 'Run test');
  const preset = (label, t, id) => h('button', { class: 'btn quiet', onclick: () => { type = t; idInput.value = id; drawSeg(); } }, label);
  return h('section', { id: 'sec-test' },
    h('h2', { text: 'Test' }),
    h('p', { class: 'lead', text: 'Run the same lookup a player would, with your current settings, and see what each provider returned.' }),
    row('Title', 'Use an IMDb id like Stremio does. Episodes are id:season:episode.', seg, h('div', { style: 'margin-top:10px' }, idInput),
      h('div', { class: 'actions' }, run, preset('Inception', 'movie', 'tt1375666'), preset('Breaking Bad S1E1', 'series', 'tt0903747:1:1'))),
    out);
}
function renderResult(r) {
  const host = (u) => { try { return new URL(u).hostname; } catch { return ''; } };
  return h('div', {},
    h('p', { class: 'note ' + (r.streams.length ? 'ok' : 'warn'), style: 'margin:0', text: `${r.streams.length} stream${r.streams.length === 1 ? '' : 's'} in ${(r.ms / 1000).toFixed(1)} s, TMDB ${r.target.mediaType} ${r.target.tmdbId}` }),
    r.report.length === 0 ? h('p', { class: 'empty', text: 'No provider is enabled for this type.' }) : h('div', { class: 'scroll', style: 'margin-top:10px' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Provider', 'Result', 'Time'].map((x) => h('th', { text: x })))),
      h('tbody', {}, r.report.map((p) => h('tr', {}, h('td', { text: p.name.replace(/\.$/, '') }),
        h('td', {}, p.error ? h('span', { class: 'pill bad', text: p.error }) : h('span', { class: 'pill ' + (p.count ? 'ok' : 'warn'), text: p.count ? `${p.count} streams` : 'no streams' })),
        h('td', { text: p.ms + ' ms' })))))),
    h('div', { style: 'margin-top:14px' }, r.streams.map((s) => h('div', { class: 'stream' },
      h('div', { class: 't', text: `${s.quality || 'Unknown quality'} from ${s.provider}` }),
      h('button', { class: 'btn quiet', onclick: () => copy(s.url) }, 'Copy link'),
      h('div', { class: 'u mono', text: [s.title, s.size, host(s.url)].filter(Boolean).join('   ') })))),
    h('details', {}, h('summary', { text: `Network trace (${r.trace.length} requests)` }),
      h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Status', 'Host', 'Path', 'DNS', 'Time'].map((x) => h('th', { text: x })))),
        h('tbody', {}, r.trace.map((t) => h('tr', {},
          h('td', {}, t.error ? h('span', { class: 'pill bad', text: 'error' }) : h('span', { class: 'pill ' + (t.status < 400 ? 'ok' : 'warn'), text: String(t.status) })),
          h('td', { class: 'mono' }, t.host, t.mirror && h('div', { class: 'note', style: 'margin:0', text: t.mirror })),
          h('td', { class: 'mono', text: t.error || t.path }),
          h('td', { text: `${t.dns || ''}${t.ip ? ', ' + t.ip : ''}` }),
          h('td', { text: t.ms + ' ms' }))))))),
    r.logs.length > 0 && h('details', {}, h('summary', { text: 'Provider logs' }), h('pre', { text: r.logs.join('\n') })));
}

/* ---------- Settings ---------- */
function buildSettings() {
  const keyInput = h('input', { type: 'password', class: 'mono', value: cfg.tmdbKey, placeholder: status.serverTmdbKey ? 'Optional: the server already has one' : 'TMDB v3 API key', autocomplete: 'off', 'aria-label': 'TMDB API key', oninput: (e) => { cfg.tmdbKey = e.target.value.trim(); onChange(); } });
  const file = h('input', { type: 'file', accept: 'application/json', style: 'display:none', onchange: async (e) => {
    try { cfg = merge(JSON.parse(await e.target.files[0].text())); onChange(); rebuildAll(); toast('Imported'); } catch { toast('That file is not valid settings JSON'); }
  } });
  return h('section', { id: 'sec-settings' },
    h('h2', { text: 'Settings' }),
    h('p', { class: 'lead', text: 'Global options for how streams are collected and listed.' }),
    row('TMDB API key', 'Providers look titles up on TMDB. Use the v3 key from themoviedb.org/settings/api. On Vercel, set TMDB_API_KEY instead to keep it out of links.',
      keyInput,
      h('label', { class: 'note', style: 'display:block' }, h('input', { type: 'checkbox', onchange: (e) => { keyInput.type = e.target.checked ? 'text' : 'password'; } }), ' Show key'),
      status.serverTmdbKey && h('p', { class: 'note ok', text: 'This server has a TMDB_API_KEY, so you can leave this empty.' })),
    row('Provider time limit', 'How long to wait for a source before giving up on it.',
      h('input', { type: 'number', min: 3, max: 55, value: Math.round(cfg.timeoutMs / 1000), 'aria-label': 'Seconds', style: 'width:100px', oninput: (e) => { cfg.timeoutMs = Math.min(55, Math.max(3, Number(e.target.value) || 25)) * 1000; onChange(); } }), ' seconds'),
    row('Order', 'Group streams by provider, or put the highest resolution first across all providers.',
      h('select', { 'aria-label': 'Order', onchange: (e) => { cfg.sort = e.target.value; onChange(); } }, [['provider', 'By provider'], ['quality', 'Best quality first']].map(([v, l]) => h('option', { value: v, selected: cfg.sort === v, text: l })))),
    row('Streams per provider', 'Cap each list so players are not flooded. 0 means no cap.',
      h('input', { type: 'number', min: 0, max: 50, value: cfg.maxPerProvider, 'aria-label': 'Max streams', style: 'width:100px', oninput: (e) => { cfg.maxPerProvider = Math.min(50, Math.max(0, Number(e.target.value) || 0)); onChange(); } })),
    row('Backup', 'Export your settings, import them on another deployment, or start over.',
      h('div', { class: 'actions', style: 'margin-top:0' },
        h('button', { class: 'btn', onclick: () => { h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(compact(cfg), null, 2)], { type: 'application/json' })), download: 'streamhub-settings.json' }).click(); } }, 'Export'),
        h('button', { class: 'btn', onclick: () => file.click() }, 'Import'), file,
        h('button', { class: 'btn quiet', onclick: () => { if (confirm('Reset every setting?')) { cfg = merge({}); onChange(); rebuildAll(); } } }, 'Reset'))));
}

/* ---------- boot ---------- */
const builders = { install: buildInstall, providers: buildProviders, dns: buildDns, test: buildTest, settings: buildSettings };
function rebuildTab(id) { const old = $('#sec-' + id); const el = builders[id](); if (old) old.replaceWith(el); else $('#main').append(el); showTab(current); }
function rebuildAll() { for (const [id] of TABS) rebuildTab(id); renderChain(); }

async function boot() {
  $('#tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { id: 'tab-' + id, role: 'tab', 'aria-selected': 'false', onclick: () => showTab(id) }, label)));
  const m = location.pathname.match(/^\/(c|u)\/([^/]+)/);
  try { status = await api('/api/status'); } catch { /* keep defaults */ }
  try { providers = (await api('/api/providers')).providers; } catch (e) { toast(e.message); }

  let banner = null;
  if (m && m[1] === 'c') { try { cfg = merge(unb64u(m[2])); profile = null; banner = 'Loaded from your addon link. Edits here create a new link.'; } catch { /* ignore */ } }
  if (m && m[1] === 'u') {
    let secret = profile && profile.id === m[2] ? profile.secret : '';
    if (!secret) { const v = prompt('Enter the edit key for this profile (id:secret)'); if (v) secret = v.split(':')[1]; }
    try {
      const r = await api(`/api/profile/${m[2]}`, { headers: { 'X-Profile-Secret': secret || '' } });
      cfg = merge(r.config); profile = { id: m[2], secret }; localStorage.setItem(LP, JSON.stringify(profile));
      banner = 'Editing your saved profile. Changes apply everywhere immediately.';
    } catch (e) { banner = e.message; }
  }
  rebuildAll();
  if (banner) $('#urls').before(h('p', { class: 'note ok', style: 'margin:0 0 12px', text: banner }));
  const start = location.hash.slice(1);
  showTab(TABS.some(([id]) => id === start) ? start : 'install');
  localStorage.setItem(LS, JSON.stringify(compact(cfg)));
}
boot();
</script>
